# Include these locations in the existing aihub0508.com HTTPS server block.
# The upstream service binds to loopback and never logs or persists client IPs.

location = /api/v1/telemetry/event {
    client_max_body_size 4k;
    access_log off;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 5s;
}

location = /api/v1/telemetry/summary {
    access_log off;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
}
