name: Native memory host readiness (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIHUB_SSH_HOST: ${{ secrets.AIHUB_SSH_HOST }}
      AIHUB_SSH_USER: ${{ secrets.AIHUB_SSH_USER }}
      AIHUB_SSH_KEY: ${{ secrets.AIHUB_SSH_KEY }}
      AIHUB_SSH_PORT: ${{ secrets.AIHUB_SSH_PORT || '22' }}
    steps:
      - name: Read server capabilities with pre-established public host-key pins
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AIHUB_SSH_KEY" > ~/.ssh/aihub_key
          chmod 600 ~/.ssh/aihub_key
          cat > ~/.ssh/known_hosts <<'HOSTS'
          aihub-pinned ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHJETnY8FTc+8UrXHfCDUblNRP6gsFf5KFfwsMPaZZLf
          aihub-pinned ssh-rsa 
          aihub-pinned ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOn+8XNOgJ89F4RCC6GNxs+V0dsQaNmQtsdRN73GfAcFspoEtYBMU+qG/pLlBJP99Wd9DtSXkme30a+ckUetjdk=
          HOSTS
          ssh -T -i ~/.ssh/aihub_key -p "$AIHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=aihub-pinned -o ConnectTimeout=10 "$AIHUB_SSH_USER@$AIHUB_SSH_HOST" 'python3 -' <<'REMOTE_PY'
          import json,os,platform,shutil
          mem={}
          try:
           for line in open('/proc/meminfo'):
            if line.startswith('MemAvailable:'):mem['available_mb']=int(line.split()[1])//1024
          except OSError:pass
          print(json.dumps({'read_only':True,'os':platform.system(),'python':platform.python_version(),'uid':os.getuid(),'python311':bool(shutil.which('python3.11')),'python312':bool(shutil.which('python3.12')),'docker':bool(shutil.which('docker')),'opt_writable':os.access('/opt',os.W_OK),'tmp_free_mb':shutil.disk_usage('/tmp').free//1048576,'memory':mem}))
          REMOTE_PY
