name: Publish organization memory website module
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aihub-official-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AIHUB_SSH_HOST: ${{ secrets.AIHUB_SSH_HOST }}
      AIHUB_SSH_USER: ${{ secrets.AIHUB_SSH_USER }}
      AIHUB_SSH_KEY: ${{ secrets.AIHUB_SSH_KEY }}
      AIHUB_SSH_PORT: ${{ secrets.AIHUB_SSH_PORT || '22' }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Checkout verified page
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3e51e6374ceb805b39b9ddbfa393ff9277cffef2
          path: site
      - name: Prepare pinned SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AIHUB_SSH_KEY" > ~/.ssh/aihub_key
          chmod 600 ~/.ssh/aihub_key
          cat > ~/.ssh/known_hosts <<'HOSTS'
          aihub-pinned ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHJETnY8FTc+8UrXHfCDUblNRP6gsFf5KFfwsMPaZZLf
          aihub-pinned ssh-rsa 
          aihub-pinned ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOn+8XNOgJ89F4RCC6GNxs+V0dsQaNmQtsdRN73GfAcFspoEtYBMU+qG/pLlBJP99Wd9DtSXkme30a+ckUetjdk=
          HOSTS
      - name: Publish versioned icons and atomically replace the homepage
        shell: bash
        run: |
          set -euo pipefail
          remote="${AIHUB_SSH_USER}@${AIHUB_SSH_HOST}"
          opts=(-i ~/.ssh/aihub_key -p "$AIHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=aihub-pinned -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          stage=$(ssh "${opts[@]}" "$remote" 'mktemp -d /tmp/amh-site-module.XXXXXXXX')
          [[ "$stage" =~ ^/tmp/amh-site-module\.[A-Za-z0-9]+$ ]]
          scp -i ~/.ssh/aihub_key -P "$AIHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=aihub-pinned site/docs/visuals/agent-memory-hub-official-site.html "$remote:$stage/index.html"
          ssh "${opts[@]}" "$remote" "mkdir '$stage/assets'"
          scp -i ~/.ssh/aihub_key -P "$AIHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=aihub-pinned site/docs/visuals/media/native-memory/*.png "$remote:$stage/assets/"
          ssh "${opts[@]}" "$remote" "python3.11 - '$stage/index.html' '$GITHUB_RUN_ID'" < deploy/site-module/publish.py | tee site-publish-receipt.json
          curl -fsS --retry 2 --max-time 20 "https://aihub0508.com/?module_publish=$GITHUB_RUN_ID" -o published.html
          echo '82908297363fec676d67d9b6fb53fa2eea2387deec023e9dd566853ae5f33e0d  published.html' | sha256sum -c -
          curl -fsS --max-time 15 "https://aihub0508.com/assets/native-memory/chatgpt-desktop-dc5090afda.png" -o published-logo.png
          echo 'dc5090afda4e54f06726e6bf4c962e6f625f02455a3d7b240ec92cdd3b90dd1a  published-logo.png' | sha256sum -c -
          curl -fsS --max-time 15 "https://aihub0508.com/assets/native-memory/claude-cowork-d09eb2fe66.png" -o published-logo.png
          echo 'd09eb2fe66c52aad0f1b0069083edaf5892d24302a30798e24621f26f65678d5  published-logo.png' | sha256sum -c -
          curl -fsS --max-time 10 https://aihub0508.com/native/v1/ready
          ssh "${opts[@]}" "$remote" "test -f '$stage/index.html' && rm -rf -- '$stage'"
      - name: Preserve publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: organization-module-publication
          path: site-publish-receipt.json
