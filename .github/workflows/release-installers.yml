name: release-installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Build the client wheel
        # Organization memory installs from this wheel, so a member's machine
        # never receives a source checkout.
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip build
          python -m build --wheel --outdir dist .
          ls -l dist/*.whl

      - name: The tag names the version that was built
        env:
          AMH_GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          built=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' agent_brain/_version.py)
          case "$AMH_GITHUB_REF_NAME" in
            v*) [ "v$built" = "$AMH_GITHUB_REF_NAME" ] || { echo "tag $AMH_GITHUB_REF_NAME does not match version $built" >&2; exit 1; } ;;
          esac
          ls "dist/agent_memory_hub-$built-py3-none-any.whl"

      - name: Prepare release installer assets
        env:
          AMH_GITHUB_REPOSITORY: ${{ github.repository }}
          AMH_GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          # Pinned server installer: a deployment script should not drift with
          # whatever main happens to hold at the moment someone pipes it to sudo.
          cp deploy/deploy.sh dist/deploy.sh
          # The organization-mode installer dispatches before any clone, so it
          # must ship as the same pinned asset.
          cp install-native.sh dist/install-native.sh
          # One-command Hub install/upgrade, plus the two files it verifies
          # and runs (the same ones the deploy workflow ships to aihub).
          cp deploy/native-memory/hub.sh dist/hub.sh
          cp deploy/native-memory/upgrade.sh dist/upgrade.sh
          cp deploy/native-memory/semantic-model.json dist/semantic-model.json
          cp docs/native-memory/user-guide.zh.md dist/user-guide.zh.md
          # The installer must name the wheel it downloads, and pip rejects a
          # wheel filename without a version, so bake this tag in.
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["AMH_GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          path = Path("dist/install-native.sh")
          path.write_text(path.read_text().replace("__AMH_VERSION__", version))
          hub = Path("dist/hub.sh")
          hub.write_text(
              hub.read_text()
              .replace("__AMH_VERSION__", version)
              .replace("__AMH_RELEASE_SHA__", os.environ["GITHUB_SHA"])
          )
          PY
          python - <<'PY'
          import os
          from pathlib import Path

          replacements = {
              'RELEASE_REPO="__AMH_GITHUB_REPOSITORY__"':
                  f'RELEASE_REPO="{os.environ["AMH_GITHUB_REPOSITORY"]}"',
              'RELEASE_REF="__AMH_GITHUB_REF_NAME__"':
                  f'RELEASE_REF="{os.environ["AMH_GITHUB_REF_NAME"]}"',
              '$ReleaseRepo = "__AMH_GITHUB_REPOSITORY__"':
                  f'$ReleaseRepo = "{os.environ["AMH_GITHUB_REPOSITORY"]}"',
              '$ReleaseRef = "__AMH_GITHUB_REF_NAME__"':
                  f'$ReleaseRef = "{os.environ["AMH_GITHUB_REF_NAME"]}"',
          }
          for path in [Path("dist/install.sh"), Path("dist/install.ps1")]:
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          chmod +x dist/install.sh dist/deploy.sh dist/install-native.sh dist/hub.sh dist/upgrade.sh
          (cd dist && sha256sum install.sh install.ps1 deploy.sh install-native.sh hub.sh upgrade.sh semantic-model.json user-guide.zh.md *.whl > checksums.txt)

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/install.sh
            dist/install.ps1
            dist/deploy.sh
            dist/install-native.sh
            dist/hub.sh
            dist/upgrade.sh
            dist/semantic-model.json
            dist/*.whl
            dist/user-guide.zh.md
            dist/checksums.txt
