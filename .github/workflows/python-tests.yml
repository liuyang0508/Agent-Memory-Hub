name: python-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Provenance tests verify frozen candidate commits that precede the
          # documentation-only PR head, so the default shallow checkout is
          # insufficient.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type regression gate
        run: python scripts/check_mypy_baseline.py
      - name: Strict type check for governance-critical modules
        run: >-
          mypy --follow-imports=silent
          agent_brain/agent_integrations/qoder.py
          agent_brain/evaluation/memorydata_runner.py
          agent_brain/platform/indexing/index.py
          agent_brain/memory/store/write_service.py
          agent_brain/memory/governance/contradiction_containment.py
          agent_brain/memory/governance/contradiction_resolution.py
          agent_brain/interfaces/sdk/components.py
          agent_brain/interfaces/sdk/sdk.py
          web/auth.py
          web/api/routes/auth.py
          web/api/routes/events.py
      - name: Unit tests
        env:
          MEMORY_HUB_TEST_EMBEDDING: "1"
        run: python -m pytest tests/unit -q --cov=agent_brain --cov=web --cov-report=term-missing
      - name: Conformance tests (CLI + MCP)
        env:
          MEMORY_HUB_TEST_EMBEDDING: "1"
        run: python -m pytest tests/conformance/test_cli_e2e.py tests/conformance/test_mcp_e2e.py -q
